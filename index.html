<!-- 1. Placerceringen av <script> påverkas hur JavaScript koden körs. 
     Ifall den placeras i <head> körs den innan sidan har laddats färdigt.

<!-- 2. Defer attributet gör så att webbläsaren kör JavaScript filen samtidigt som HTML läses in. 
     Men den väntar tills hela HTML filen har laddats färdigt. 
     Förhindrar att scriptet blockar sidans laddning. -->
